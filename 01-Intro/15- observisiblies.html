<html>
	<head>
		<script src="https://unpkg.com/rxjs@^7/dist/bundles/rxjs.umd.min.js"></script>

		<script>
			var observable=new rxjs.Observable(function subscribe(subscriber){
			
				setTimeout(()=>{
					subscriber.next("1");
				},100);
				
				setTimeout(()=>{
					subscriber.next("2");
				},200);
				
				setTimeout(()=>{
					subscriber.next("3");
					subscriber.error("error");
				},300);
				
				
				
				setTimeout(()=>{
					subscriber.next("4");
					subscriber.complete();
				},700);
			});
			
			var subscriber =observable.subscribe((data)=>{
				console.log(data);
			},(error)=>console.log(error),()=>console.log("completed"));
			
			var subscriber2 =observable.subscribe((data)=>{
				console.log(data);
			},(error)=>console.log(error),()=>console.log("completed"));
			
			
			console.log("done");
			//subscriber.unsubscribe();
			
			//console.log(subscriber);
		</script>
	</head>
	
	<body>
	
	</body>
</html>
